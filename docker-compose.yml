services:
  patron_c2_server:
    image: patronc2/server
    environment:
      DB_HOST: patron_c2_postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      TCP_LISTENER_IP: patron_c2_server
      TCP_LISTENER_PORT: ${TCP_LISTENER_PORT}
      QUIC_LISTENER_IP: patron_c2_server
      QUIC_LISTENER_PORT: ${QUIC_LISTENER_PORT}
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs
      - ./files:/app/files
      - agent_files:/app/agent_files
    networks:
      - internal_c2_network
    ports:
      - "${TCP_LISTENER_PORT}:${TCP_LISTENER_PORT}/tcp"
      - "${QUIC_LISTENER_PORT}:${QUIC_LISTENER_PORT}/udp"
    depends_on:
      patron_c2_api:
        condition: service_healthy

  patron_c2_api:
    image: patronc2/api
    environment:
      DB_HOST: patron_c2_postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      WEBSERVER_PORT: ${WEBSERVER_PORT}
      PUBLIC_KEY: ${PUBLIC_KEY}
      REPO_DIR: ${REPO_DIR}
      JWT_KEY: ${JWT_KEY}
      ADMIN_AUTH_USER: ${ADMIN_AUTH_USER}
      ADMIN_AUTH_PASS: ${ADMIN_AUTH_PASS}
      REDIRECTOR_PORT: ${REDIRECTOR_PORT}
      REACT_APP_NGINX_IP: ${REACT_APP_NGINX_IP}
      REACT_APP_NGINX_PORT: ${REACT_APP_NGINX_PORT}
      TCP_LISTENER_PORT: ${TCP_LISTENER_PORT}
      QUIC_LISTENER_PORT: ${QUIC_LISTENER_PORT}
      DOCKER_HTTPS_PROXY: ${HTTPS_PROXY}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED}
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./payloads:/app/payloads
      - ./files:/app/files
      - /var/run/docker.sock:/var/run/docker.sock
      - ./client/payloads.json:/app/payloads.json
      - ./redirector/resources:/app/resources
      - ./certs:/app/certs
      - agent_files:/app/agent_files
    networks:
      - internal_c2_network
    depends_on:
      patron_c2_postgres:
        condition: service_healthy

  patron_c2_frontend:
    image: patronc2/ui
    working_dir: /app
    restart: always
    volumes:
      - ./frontend-config.json:/usr/share/nginx/html/config.json:ro
      - ./logs:/app/logs
    environment:
      - PORT=${PORT}
    networks:
      - internal_c2_network
    depends_on:
      patron_c2_api:
        condition: service_healthy

  patron_c2_postgres:
    image: patronc2/postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"
    networks:
      - internal_c2_network

  patron_c2_nginx:
    image: patronc2/nginx
    restart: always
    volumes:
      - ./nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template
      - ./certs/server.pem:/etc/nginx/ssl/nginx.crt
      - ./certs/server.key:/etc/nginx/ssl/nginx.key
    environment:
      - REACT_SERVER=patron_c2_frontend:${PORT}
      - REACT_APP_NGINX_PORT=${REACT_APP_NGINX_PORT}
      - API_SERVER=patron_c2_api:${WEBSERVER_PORT}
      - OPENSEARCH_DASHBOARDS_SERVER=dashboards
    networks:
      - internal_c2_network
    ports:
      - "${REACT_APP_NGINX_PORT}:${REACT_APP_NGINX_PORT}"
    depends_on:
      patron_c2_frontend:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      - discovery.type=single-node
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - internal_c2_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:${OPENSEARCH_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - SERVER_BASEPATH=/osd
      - SERVER_REWRITEBASEPATH=true
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    networks:
      - internal_c2_network
    depends_on:
      opensearch:
        condition: service_healthy

  patron_c2_bot:
    image: patronc2/bot
    environment:
      - PATRON_IP=patron_c2_nginx
      - PATRON_PORT=${REACT_APP_NGINX_PORT}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - HTTPS_PROXY=${HTTPS_PROXY}
    networks:
      - internal_c2_network
    depends_on:
      patron_c2_api:
        condition: service_healthy
    volumes:
      - ./bot/data:/root/.patron
      - /usr/bin/patron:/usr/bin/patron
    entrypoint: ["./bot"]
    restart: "no"

networks:
  internal_c2_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${DOCKER_INTERNAL}.0/16"

volumes:
  agent_files:
  opensearch_data:
